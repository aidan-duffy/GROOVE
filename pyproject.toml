[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groove"
version = "1.0.9"
description = "Periodic-variability and deep-occultation search in ATLAS light curves of young stars"
readme = "README.md"
license = {text = "GPL-3.0-only"}
authors = [{name = "Aidan Duffy"}]
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "scipy>=1.10",
  "astropy>=5.2",
  "scikit-learn>=1.3",
  "umap-learn>=0.5.5",
  "numba>=0.58",
  "joblib>=1.4",
  "PyYAML>=6",
  "matplotlib>=3.7",
  "plotly>=5.24",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.scripts]
groove = "groove.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groove = ["morphology/defaults.yaml"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
