[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groove"
version = "1.1.1"
description = "ATLAS light-curve variability exploration, period searches and morphology analysis"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Aidan Duffy"}]
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "astropy>=5.2",
  "scikit-learn>=1.3",
  "umap-learn>=0.5.5",
  "numba>=0.58",
  "joblib>=1.4",
  "PyYAML>=6",
  "matplotlib>=3.7",
  "plotly>=5.24",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.scripts]
groove = "groove.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groove = ["morphology/defaults.yaml"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
